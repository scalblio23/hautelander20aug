<style>
.image-marquee{
  --fade: 20%;
  --gap: 32px;
  --pxPerSecond: 55; /* LOWER = SLOWER (try 45–70) */
  width: 100%;
  overflow: hidden;
  padding: 24px 0;

  -webkit-mask-image: linear-gradient(to right,
    transparent 0%,
    #000 var(--fade),
    #000 calc(100% - var(--fade)),
    transparent 100%
  );
  mask-image: linear-gradient(to right,
    transparent 0%,
    #000 var(--fade),
    #000 calc(100% - var(--fade)),
    transparent 100%
  );
}

.image-track{
  display: flex;
  width: max-content;
  will-change: transform;
  transform: translate3d(0,0,0);
}

.image-track.is-running{
  animation-name: imageScroll;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  animation-duration: var(--duration, 40s);
}

.image-set{
  display: flex;
  gap: var(--gap);
  padding-right: var(--gap);
}

.image-set img{
  height: 420px;
  width: auto;
  display: block;
  object-fit: cover;
  border-radius: 18px;
}

@keyframes imageScroll{
  from { transform: translate3d(0,0,0); }
  to   { transform: translate3d(calc(-1 * var(--setWidth, 0px)),0,0); }
}

@media (max-width: 768px){
  .image-set img{ height: 260px; border-radius: 14px; }
}
</style>

<script>
(() => {
  const marquee = document.getElementById('kitchenMarquee');
  const track   = marquee.querySelector('.image-track');
  const set1    = marquee.querySelector('.image-set'); // first set
  const imgs    = marquee.querySelectorAll('img');

  function waitImagesLoaded() {
    return Promise.all([...imgs].map(img => (
      img.complete && img.naturalWidth
        ? Promise.resolve()
        : new Promise(res => { img.onload = img.onerror = () => res(); })
    )));
  }

  function setup() {
    // measure after layout
    const setWidth = set1.getBoundingClientRect().width;

    // px/sec -> duration seconds
    const pxPerSecond = parseFloat(getComputedStyle(marquee).getPropertyValue('--pxPerSecond')) || 55;
    const durationSec = Math.max(10, setWidth / pxPerSecond);

    track.style.setProperty('--setWidth', `${setWidth}px`);
    track.style.setProperty('--duration', `${durationSec}s`);

    // restart animation cleanly (prevents “jump”)
    track.classList.remove('is-running');
    void track.offsetWidth; // reflow
    track.classList.add('is-running');
  }

  let resizeTimer;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(setup, 150);
  }

  waitImagesLoaded().then(() => {
    requestAnimationFrame(() => {
      setup();
      window.addEventListener('resize', onResize);
    });
  });
})();
</script>
